<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tus flores para tu BRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050400;
  --gold:#ffc814;
  --gold-soft:#ffe37a;
  --brown:#5a3a0a;
  --script:"Dancing Script","Segoe Script","Brush Script MT",cursive;
  --sans:"Quicksand","Trebuchet MS",system-ui,sans-serif;
  --glows:
    radial-gradient(ellipse 50% 42% at 0% 22%,rgba(200,190,0,.55),transparent 70%),
    radial-gradient(ellipse 50% 48% at 100% 32%,rgba(180,170,0,.5),transparent 70%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--glows),var(--ink);color:#fff;font-family:var(--sans);overflow:hidden}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

/* ---------- pantalla de entrada ---------- */
.gate{
  position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;padding:24px;background:var(--glows),var(--ink);transition:opacity .7s ease;
}
.gate.out{opacity:0;pointer-events:none}
.gate canvas{width:120px;height:120px;filter:drop-shadow(0 0 22px rgba(255,200,20,.55));animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{
  max-width:92vw;background:var(--gold);color:#3a2700;border:0;border-radius:999px;
  padding:16px 34px;font:700 18px/1.2 var(--sans);cursor:pointer;
  box-shadow:0 0 30px rgba(255,200,20,.55);
}
.enter:hover{background:#ffd54a}
.enter:disabled{opacity:.7;cursor:default}

/* ---------- controles ---------- */
.hint{
  position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(255,200,20,.12);color:var(--gold-soft);
  border:1px solid rgba(255,200,20,.45);border-radius:999px;
  padding:10px 22px;font:700 15px var(--sans);cursor:pointer;opacity:0;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.hint.show{animation:hintIn .8s 3.2s forwards}
.hint:hover{background:rgba(255,200,20,.24)}
@keyframes hintIn{to{opacity:1}}
.mute{
  position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:5;width:44px;height:44px;
  display:none;place-items:center;border-radius:50%;cursor:pointer;
  background:rgba(255,200,20,.12);color:var(--gold-soft);border:1px solid rgba(255,200,20,.45);
}
.mute.show{display:grid}
.mute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mute .off{display:none}
.mute[aria-pressed="true"] .on{display:none}
.mute[aria-pressed="true"] .off{display:block}
.enter:focus-visible,.hint:focus-visible,.mute:focus-visible,.close:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- carta ---------- */
.overlay{
  position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;
  gap:18px;padding:24px 16px;background:rgba(0,0,0,.74);overflow-y:auto;
}
.overlay::before,.overlay::after{content:"";margin:auto}
.overlay.open{display:flex;animation:fade .3s ease-out}
.overlay.open .card{animation:pop .5s cubic-bezier(.2,.9,.3,1.15)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}
.card{
  width:min(92vw,390px);flex:none;text-align:center;color:var(--brown);
  border-radius:22px;padding:28px 24px 24px;
  background:
    radial-gradient(circle at 18% 8%,rgba(255,255,255,.55),transparent 45%),
    radial-gradient(circle at 88% 92%,rgba(255,170,0,.28),transparent 50%),
    linear-gradient(160deg,#fbe58a,#f2c94a 55%,#eab72c);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.6),
    inset 0 0 0 8px rgba(184,134,11,.18),
    0 0 60px rgba(255,200,20,.45),
    0 24px 50px rgba(0,0,0,.6);
}
.card h2{font:700 46px/1.1 var(--script);margin:0 0 8px}
.card p{margin:0}
.intro{font:700 19px/1.4 var(--sans)}
.photo{
  display:block;width:fit-content;max-width:100%;margin:16px auto;overflow:hidden;
  border:6px solid #fff;border-radius:12px;background:#fff;box-shadow:0 8px 20px rgba(90,58,10,.35);
}
.photo img{display:block;max-width:100%;max-height:52vh;max-height:52dvh;width:auto;height:auto}
.msg{font:700 22px/1.25 var(--sans);letter-spacing:.02em;color:#4a2f04}
.to{
  display:inline-block;margin-top:14px;padding:6px 20px;
  border:2px solid var(--brown);border-radius:999px;font:700 14px var(--sans);
}
.close{
  flex:none;background:var(--gold);color:#3a2700;border:0;border-radius:999px;
  padding:12px 34px;font:700 16px var(--sans);cursor:pointer;box-shadow:0 0 24px rgba(255,200,20,.6);
}
.close:hover{background:#ffd54a}

@media (prefers-reduced-motion:reduce){
  .gate canvas{animation:none}
  .hint.show{animation:none;opacity:1}
  .overlay.open,.overlay.open .card{animation:none}
}
</style>
</head>
<body>

<canvas id="scene" role="img" aria-label="Galaxia dorada con un corazón de luz, ramos de girasoles y palabras que giran a su alrededor"></canvas>

<div class="gate" id="gate">
  <canvas id="gate-flower" width="160" height="160" aria-hidden="true"></canvas>
  <button class="enter" id="enter" type="button">Entrar por tus florecitas</button>
</div>

<button class="hint" id="hint" type="button" hidden></button>
<button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Silenciar música">
  <svg class="on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <h2 id="c-title"></h2>
    <p class="intro" id="c-intro"></p>
    <div class="photo" id="c-photo"><img id="c-img" alt=""></div>
    <p class="msg" id="c-msg"></p>
    <span class="to" id="c-to"></span>
  </div>
  <button class="close" id="close" type="button">Cerrar</button>
</div>

<script>
/* ============================================================
   EDITA AQUÍ: palabras, textos de la carta y foto
   ============================================================ */
const CONFIG = {
  heartText: "Teamito BRO",                    // texto dentro del corazón
  hint: "Toca una flor 🌻",
  mainPhrase: ["TUS FLORES", "PARA TU BRO"],   // la frase grande que gira alrededor del corazón
  words: ["BRO", "bro", "Teamito", "Teamito BRO", "Para tu", "Tus florecitas"],
  card: {
    title: "Teamito BRO",
    intro: "Tus florecitas",
    photo: "",                                 // vacío = usa la foto incluida. O pon "foto.jpg"
    photoAlt: "Foto",
    message: "TUS FLORES PARA TU BRO",
    to: "Para tu BRO"
  }
};
/* ============================================================ */

function main(){
'use strict';
const $ = id => document.getElementById(id);
const cv = $('scene'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = Math.min(innerWidth, innerHeight) < 700;
const LOW = MOBILE || (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
const SANS = '"Quicksand","Trebuchet MS",system-ui,sans-serif';
const SCRIPT = '"Dancing Script","Segoe Script","Brush Script MT",cursive';
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const tri = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = rng(20260919);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

/* ---------- girasol / ramo ---------- */
function sunflower(g, x, y, r){
  [{n:20, len:1, c1:'#ffb703', c2:'#f48c06', rot:0}, {n:20, len:.94, c1:'#ffe04a', c2:'#ffc300', rot:Math.PI/20}].forEach(l => {
    for(let i = 0; i < l.n; i++){
      g.save(); g.translate(x, y); g.rotate(i / l.n * TAU + l.rot);
      const gr = g.createLinearGradient(r*.3, 0, r*l.len, 0);
      gr.addColorStop(0, l.c2); gr.addColorStop(1, l.c1);
      g.fillStyle = gr; g.strokeStyle = 'rgba(150,70,0,.55)'; g.lineWidth = Math.max(.5, r*.02);
      g.beginPath(); g.ellipse(r*(.3+l.len)/2, 0, r*(l.len-.3)/2, r*.115, 0, 0, TAU); g.fill(); g.stroke();
      g.restore();
    }
  });
  const cg = g.createRadialGradient(x, y, 0, x, y, r*.44);
  cg.addColorStop(0, '#2b1a06'); cg.addColorStop(.7, '#4a2d0b'); cg.addColorStop(1, '#7a4b12');
  g.fillStyle = cg; g.beginPath(); g.arc(x, y, r*.44, 0, TAU); g.fill();
  g.fillStyle = 'rgba(214,160,70,.75)';
  for(let i = 1; i < 48; i++){
    const rr = r*.4*Math.sqrt(i/48), a = i*2.39996;
    g.beginPath(); g.arc(x + rr*Math.cos(a), y + rr*Math.sin(a), r*.028, 0, TAU); g.fill();
  }
}
function leaf(g, x, y, len, ang, col){
  g.save(); g.translate(x, y); g.rotate(ang);
  g.fillStyle = col; g.beginPath(); g.moveTo(0, 0);
  g.quadraticCurveTo(len*.5, -len*.28, len, 0); g.quadraticCurveTo(len*.5, len*.28, 0, 0); g.fill();
  g.strokeStyle = 'rgba(0,60,0,.45)'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(len*.9, 0); g.stroke();
  g.restore();
}
const BQV = [
  [[78,116,34],[182,116,34],[104,72,31],[156,72,31],[130,120,46]],
  [[84,108,36],[176,108,36],[130,96,48]],
  [[74,122,30],[186,122,30],[100,80,34],[160,80,34],[130,52,30],[130,118,44]]
];
const BW = 260, BH = 330, ASP = BW / BH;
function bouquet(flowers){
  const c = mk(BW, BH), g = c.getContext('2d');
  g.strokeStyle = '#2f7d32'; g.lineWidth = 5; g.lineCap = 'round';
  flowers.forEach(([x, y]) => { g.beginPath(); g.moveTo(130, 262); g.quadraticCurveTo((x+130)/2, 180, x, y); g.stroke(); });
  const lc = ['#3f9b3a', '#2f7d32', '#57b04a'];
  [[-2.6,70],[-2.2,60],[-.55,70],[-.95,62],[-3,55],[-.15,55]].forEach(([a, l], i) => leaf(g, 130 + Math.cos(a)*10, 168, l, a, lc[i % 3]));
  const wg = g.createLinearGradient(60, 150, 200, 300);
  wg.addColorStop(0, '#f1d9a4'); wg.addColorStop(1, '#c99a55');
  g.fillStyle = wg; g.beginPath(); g.moveTo(52, 150); g.quadraticCurveTo(130, 196, 208, 150);
  g.lineTo(152, 304); g.quadraticCurveTo(130, 314, 108, 304); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(92, 172); g.lineTo(118, 300); g.moveTo(168, 172); g.lineTo(142, 300); g.stroke();
  g.strokeStyle = 'rgba(120,80,20,.35)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(52, 150); g.quadraticCurveTo(130, 196, 208, 150); g.stroke();
  flowers.forEach(([x, y, r]) => sunflower(g, x, y, r));
  g.fillStyle = '#3f9b3a'; g.strokeStyle = '#22591f'; g.lineWidth = 2;
  [-1, 1].forEach(s => {
    g.save(); g.translate(130, 214); g.rotate(s*.45);
    g.beginPath(); g.ellipse(s*22, 0, 24, 12, 0, 0, TAU); g.fill(); g.stroke(); g.restore();
  });
  g.fillStyle = '#2f7d32'; g.beginPath(); g.arc(130, 214, 8, 0, TAU); g.fill(); g.stroke();
  return c;
}
function glow(w, h, stops){
  const c = mk(w, h), g = c.getContext('2d');
  const gr = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.min(w, h)/2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, w, h); return c;
}
function textSprite(lines, {weight = 700, family = SANS, px = 64, fill = '#fff', glowCol = 'rgba(255,200,40,.9)', blur = 14, stroke = null} = {}){
  const m = mk(8, 8).getContext('2d'); m.font = `${weight} ${px}px ${family}`;
  const lh = px*1.15; let w = 0; lines.forEach(t => { w = Math.max(w, m.measureText(t).width); });
  const pad = Math.ceil(blur*1.6 + px*.08), cw = Math.ceil(w + pad*2), ch = Math.ceil(lh*lines.length + pad*2);
  const c = mk(cw, ch), g = c.getContext('2d');
  g.font = m.font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  lines.forEach((t, i) => {
    const y = pad + lh*(i + .5);
    if(stroke){ g.shadowBlur = 0; g.lineWidth = px*.07; g.strokeStyle = stroke; g.strokeText(t, cw/2, y); }
    g.shadowColor = glowCol; g.shadowBlur = blur;
    g.fillStyle = typeof fill === 'function' ? fill(g, pad + lh*i, lh) : fill;
    g.fillText(t, cw/2, y);
  });
  return {c, bw: w, bh: lh*lines.length, px};
}
const HT = t => [16*Math.pow(Math.sin(t),3), 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)];

/* ---------- estado ---------- */
const CAM = 3.2, HEART_H = .46, HEART_Y = .44, ROT = .06;
const BK = ['rgba(255,248,210,1)','rgba(255,226,115,1)','rgba(255,196,32,1)','rgba(222,172,22,1)','rgba(255,240,185,1)'];
const BA = [.95, .9, .8, .65, .4];
let W, H, DPR, BASE, CX, CY, KC, SS, ORB = 1, sp = 0, cp = 1;
let SPR, SMALL, G_CORE, G_SOFT, G_BEAM, HEART_GLOW, HTXT, MAIN, WSPR = {};
let N, GR, GT, GY, GO, GS, BS, HP, items, stars, drifters, embers;
const shoots = [], hits = [];
let built = false, time = 0, last = 0, stride = 1, accDt = 0, cntDt = 0, frameNo = 0, shootT = 1.2;

function resize(){
  DPR = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  BASE = Math.min(W*.6, H*.62); CX = W/2; CY = H*.6; KC = BASE*CAM;
  SS = clamp(BASE/460, .8, 1.35); ORB = W < 700 ? .72 : 1;
}
let rzT; const onResize = () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); };
addEventListener('resize', onResize); addEventListener('orientationchange', onResize);
resize();

/* ---------- construcción (solo tras pulsar "Entrar") ---------- */
function build(){
  SPR = [0, 1, 2].map(i => bouquet(BQV[i]));
  SMALL = mk(64, 64); sunflower(SMALL.getContext('2d'), 32, 32, 30);
  G_CORE = glow(256, 256, [[0,'rgba(255,255,235,1)'],[.18,'rgba(255,236,150,.85)'],[.5,'rgba(255,190,30,.28)'],[1,'rgba(255,170,0,0)']]);
  G_SOFT = glow(256, 256, [[0,'rgba(255,214,60,.5)'],[1,'rgba(255,190,0,0)']]);
  G_BEAM = (() => {
    const c = mk(32, 256), g = c.getContext('2d');
    const h = g.createLinearGradient(0, 256, 0, 0);
    h.addColorStop(0, 'rgba(255,225,110,.55)'); h.addColorStop(1, 'rgba(255,200,40,0)');
    g.fillStyle = h; g.fillRect(0, 0, 32, 256);
    const v = g.createLinearGradient(0, 0, 32, 0);
    v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(.5, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,1)');
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = v; g.fillRect(0, 0, 32, 256);
    return c;
  })();
  HEART_GLOW = (() => {
    const c = mk(320, 320), g = c.getContext('2d');
    g.beginPath();
    for(let i = 0; i <= 120; i++){
      const [x, y] = HT(i/120*TAU), px = 160 + x/29*230, py = 160 - (y + 2.5)/29*230;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.strokeStyle = 'rgba(255,215,70,.6)'; g.lineWidth = 6;
    g.shadowColor = '#ffbf00'; g.shadowBlur = 26; g.stroke(); g.stroke();
    return c;
  })();

  // textos como sprites (sin sombras costosas por fotograma)
  HTXT = textSprite([CONFIG.heartText], {weight: 600, family: SCRIPT, px: 90, blur: 12});
  CONFIG.words.forEach(w => { WSPR[w] = textSprite([w], {px: 64, blur: 12}); });
  MAIN = textSprite(CONFIG.mainPhrase, {
    px: 100, blur: 26, glowCol: 'rgba(255,190,20,1)', stroke: 'rgba(130,70,0,.75)',
    fill: (g, top, lh) => { const gr = g.createLinearGradient(0, top, 0, top + lh); gr.addColorStop(0, '#fffbe0'); gr.addColorStop(1, '#ffc928'); return gr; }
  });

  // corazón
  const HN = LOW ? 400 : 700; HP = [];
  for(let i = 0; i < HN; i++){
    const [hx, hy] = HT(Math.random()*TAU), nx = hx/29, ny = (hy + 2.5)/29, len = Math.hypot(nx, ny) || 1, off = tri()*.04;
    HP.push({x:nx + nx/len*off, y:ny + ny/len*off, sx:(Math.random()-.5)*3, sy:(Math.random()-.5)*3, s:.8 + Math.random()*1.5, ph:Math.random()*TAU, gold:i % 2 === 0});
  }
  HP.sort((a, b) => b.gold - a.gold);

  // galaxia
  N = LOW ? 3500 : 8000;
  let raw = [];
  for(let i = 0; i < N; i++){
    let r, th, y;
    if(Math.random() < .28){ r = .25 + Math.random()*1.15; th = Math.random()*TAU; y = tri()*.06*r; }
    else {
      r = Math.pow(Math.random(), 1.3) + .015;
      th = ((Math.random()*3)|0)*TAU/3 + 4.2*Math.sqrt(r) + tri()*.55*(.2 + r);
      y = tri()*.014*(1.2 - Math.min(r, 1));
    }
    const b0 = r < .16 ? 0 : r < .4 ? 1 : r < .72 ? 2 : 3;
    raw.push({r, th, y, bucket:(Math.random() < .18 && r > .25) ? 4 : b0, om:.1 + (r < .25 ? .9*Math.pow(1 - r/.25, 2) : 0), sz:1 + Math.random()*1.5});
  }
  raw.sort((a, b) => a.bucket - b.bucket);
  GR = new Float32Array(N); GT = new Float32Array(N); GY = new Float32Array(N); GO = new Float32Array(N); GS = new Float32Array(N);
  raw.forEach((p, i) => { GR[i] = p.r; GT[i] = p.th; GY[i] = p.y; GO[i] = p.om; GS[i] = p.sz; });
  BS = [0, 1, 2, 3, 4].map(b => { const k = raw.findIndex(p => p.bucket >= b); return k < 0 ? N : k; }); BS.push(N);
  raw = null;

  // objetos flotantes
  items = [];
  const BQ_R = [.95,.7,1,.6,.9,.75,1,.65], BQ_H = [.1,.28,.06,.22,.12,.3,.08,.2], BQ_S = [.28,.18,.3,.16,.3,.2,.26,.17];
  BQ_R.forEach((R, i) => { if(MOBILE && (i === 1 || i === 5)) return;
    items.push({type:'b', R, oy:0, h:BQ_H[i], st:0, ct:1, s:BQ_S[i], v:i % 3, a0:.2 + i*TAU/8, w:ROT, ph:rnd()*TAU, delay:1 + i*.15}); });
  const rings = [{R:.55, w:.17, tilt:.15, h:.06}, {R:.8, w:.12, tilt:-.2, h:-.04}, {R:1, w:.09, tilt:.1, h:.02}];
  const counts = MOBILE ? [3, 3, 2] : [4, 4, 4];
  let wi = 0;
  rings.forEach((rg, ri) => { for(let j = 0; j < counts[ri]; j++, wi++){
    items.push({type:'w', text:CONFIG.words[wi % CONFIG.words.length], R:rg.R, oy:HEART_Y, h:rg.h, st:Math.sin(rg.tilt), ct:Math.cos(rg.tilt),
      s:.038 + ri*.005, a0:j*TAU/counts[ri] + ri*.9, w:rg.w, ph:0, delay:1.6 + wi*.14});
  }});
  items.push({type:'m', R:.8, oy:HEART_Y, h:0, st:Math.sin(.4), ct:Math.cos(.4), s:MOBILE ? .24 : .22, a0:0, w:.34, ph:0, delay:2.2});

  stars = Array.from({length: LOW ? 90 : 150}, () => ({x:Math.random(), y:Math.random(), s:.6 + Math.random()*1.1, ph:Math.random()*TAU}));
  drifters = Array.from({length: LOW ? 24 : 44}, () => { const r = Math.random();
    return {x:Math.random(), y:Math.random(), z:.4 + Math.random()*1.1, ph:Math.random()*TAU, type:r<.4 ? 0 : r<.65 ? 1 : r<.82 ? 2 : 3, rot:(Math.random()-.5)*1.2}; });
  embers = Array.from({length: LOW ? 18 : 34}, () => ({u:Math.random(), ox:(Math.random()-.5)*.14, ph:Math.random()*TAU, sp:.12 + Math.random()*.15}));
  built = true;
}

/* ---------- dibujo ---------- */
function drawSprite(s, x, y, sc, alpha){
  ctx.globalAlpha = alpha;
  ctx.drawImage(s.c, x - s.c.width*sc/2, y - s.c.height*sc/2, s.c.width*sc, s.c.height*sc);
}

function drawItem(it, tt, intro){
  const ap = easeOut(clamp((intro - it.delay) / 1));
  if(ap <= 0) return;
  const al = ap * clamp(1.3 - (it.d - 2)*.3, .4, 1);
  if(it.type === 'b'){
    const hpx = it.s*it.k*(.7 + .3*ap), wpx = hpx*ASP;
    const bx = clamp(it.sx, wpx/2 + 6, W - wpx/2 - 6);
    ctx.save(); ctx.translate(bx, it.sy); ctx.rotate(Math.sin(tt*.7 + it.ph)*.06);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = al*.5;
    ctx.drawImage(G_SOFT, -hpx*.75, -hpx*.7, hpx*1.5, hpx*1.4);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = al;
    ctx.drawImage(SPR[it.v], -wpx/2, -hpx/2, wpx, hpx);
    ctx.restore();
    hits.push({x:bx, y:it.sy, r:hpx*.45});
  } else if(it.type === 'w'){
    const sp_ = WSPR[it.text], fs = Math.max(12, it.s*it.k*(W < 700 ? 1.25 : 1)), sc = fs/sp_.px;
    const tx = clamp(it.sx, sp_.bw*sc/2 + 8, W - sp_.bw*sc/2 - 8);
    drawSprite(sp_, tx, it.sy, sc, al);
  } else {
    // frase principal: viaja en órbita inclinada alrededor del corazón, con estela
    const a = it.a0 + tt*it.w;
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgb(255,214,80)';
    for(let j = 1; j <= 14; j++){
      const aj = a - j*.05, lz = ORB*it.R*Math.sin(aj), z = lz*it.ct, y = it.oy + lz*it.st;
      const y2 = y*cp + z*sp, z2 = z*cp - y*sp, k = KC/(z2 + CAM), f = 1 - j/15;
      ctx.globalAlpha = f*.8*ap; const s = (1 + 3*f)*SS*k/BASE;
      ctx.fillRect(CX + ORB*it.R*Math.cos(aj)*k, CY - y2*k, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    const sc = it.s*it.k/MAIN.bh, tx = clamp(it.sx, MAIN.bw*sc/2 + 8, W - MAIN.bw*sc/2 - 8);
    drawSprite(MAIN, tx, it.sy, sc, ap*clamp(1.4 - (it.d - 2)*.2, .75, 1));
    hits.push({x:tx, y:it.sy, r:MAIN.bw*sc*.4});
  }
}

function drawHeart(tt, intro){
  const yb = HEART_Y + Math.sin(tt*1.1)*.015;
  const k = KC/(-yb*sp + CAM), hx = CX, hy = CY - yb*cp*k, hp = HEART_H*k*(W < 700 ? 1.25 : 1);
  const e = easeOut(clamp((intro - .6)/2.4));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const bw = BASE*.05, bh = BASE*.55;
  ctx.globalAlpha = (.6 + .25*Math.sin(tt*1.6))*clamp((intro - 1)/1.5);
  ctx.drawImage(G_BEAM, CX - bw/2, CY - bh, bw, bh);
  const sc = hp/230;
  ctx.globalAlpha = (.55 + .15*Math.sin(tt*2))*e;
  ctx.drawImage(HEART_GLOW, hx - 160*sc, hy - 160*sc, 320*sc, 320*sc);
  let gold = null;
  for(const p of HP){
    if(p.gold !== gold){ gold = p.gold; ctx.fillStyle = gold ? 'rgb(255,214,80)' : 'rgb(255,250,225)'; }
    ctx.globalAlpha = e*(.3 + .7*Math.abs(Math.sin(tt*2 + p.ph)));
    const s = p.s*SS;
    ctx.fillRect(hx + (p.x + p.sx*(1 - e))*hp, hy - (p.y + p.sy*(1 - e))*hp, s, s);
  }
  ctx.restore();
  drawSprite(HTXT, hx, hy - hp*.02, hp*.11/HTXT.px, e);
  hits.push({x:hx, y:hy, r:hp*.5});
}

function spawnShoot(){
  const dir = Math.random() < .5 ? 1 : -1, ang = (20 + Math.random()*20)*Math.PI/180, v = 650 + Math.random()*350;
  shoots.push({x:W*(dir > 0 ? Math.random()*.7 : .3 + Math.random()*.7), y:Math.random()*H*.35,
    vx:dir*Math.cos(ang)*v, vy:Math.sin(ang)*v, life:0, max:.8 + Math.random()*.5, len:(W < 700 ? 90 : 150)*(.8 + Math.random()*.5)});
}

function frame(now){
  const rawDt = (now - last)/1000, dt = Math.min(.05, rawDt); last = now; frameNo++;
  time += dt*(reduce ? .15 : 1);
  const tt = time, intro = reduce ? 99 : time;

  // calidad adaptativa: si va lento, dibuja menos partículas
  if(frameNo > 90){ accDt += Math.min(rawDt, .1); if(++cntDt === 45){ if(accDt/45 > .027 && stride < 3) stride++; accDt = 0; cntDt = 0; } }

  const pitch = (W < 700 ? .62 : .42) + (reduce ? 0 : Math.sin(tt*.2)*.025);
  sp = Math.sin(pitch); cp = Math.cos(pitch);
  const HD = CAM - HEART_Y*sp;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  hits.length = 0;
  ctx.globalCompositeOperation = 'source-over';

  // estrellas
  const sa = clamp(intro/1.5);
  ctx.fillStyle = 'rgb(255,245,200)';
  for(const s of stars){ ctx.globalAlpha = sa*(.2 + .5*(.5 + .5*Math.sin(tt*1.5 + s.ph))); ctx.fillRect(s.x*W, s.y*H, s.s, s.s); }

  // estrellas fugaces
  if(!reduce){
    shootT -= dt;
    if(shootT <= 0 && shoots.length < 3){ spawnShoot(); shootT = 1.2 + Math.random()*2.6; }
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineWidth = 2;
    for(let i = shoots.length - 1; i >= 0; i--){
      const s = shoots[i]; s.life += dt; s.x += s.vx*dt; s.y += s.vy*dt;
      if(s.life > s.max){ shoots.splice(i, 1); continue; }
      const a = Math.sin(Math.PI*s.life/s.max), m = Math.hypot(s.vx, s.vy), tx = s.x - s.vx/m*s.len, ty = s.y - s.vy/m*s.len;
      const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(1, 'rgba(255,200,40,0)');
      ctx.globalAlpha = a; ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, 2.2, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // flores y luces que caen
  for(const d of drifters){
    d.y += dt*(reduce ? .1 : 1)*(.012 + .02*d.z);
    if(d.y > 1.05){ d.y = -.05; d.x = Math.random(); }
    const px = d.x*W + Math.sin(tt*.6 + d.ph)*14*d.z, py = d.y*H;
    ctx.globalAlpha = sa*.9;
    if(d.type === 0){ const s = 14 + 14*d.z; ctx.save(); ctx.translate(px, py); ctx.rotate(tt*d.rot); ctx.drawImage(SMALL, -s/2, -s/2, s, s); ctx.restore(); }
    else if(d.type === 1){ ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(px, py, 2 + 3*d.z, 0, TAU); ctx.stroke(); }
    else if(d.type === 2){ ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(px, py, 1.2 + 1.4*d.z, 0, TAU); ctx.fill(); }
    else { ctx.globalAlpha = sa*.8; ctx.fillStyle = '#fff'; const s = 3 + 3*d.z; ctx.fillRect(px, py, s, s); }
  }

  // galaxia
  const grow = reduce ? 1 : .12 + .88*easeOut(clamp(intro/2.8)), ga = clamp(intro/1.2);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .17*ga; ctx.drawImage(G_SOFT, CX - BASE*1.3*grow, CY - BASE*.38*grow, BASE*2.6*grow, BASE*.76*grow);
  ctx.globalAlpha = .9*ga;  ctx.drawImage(G_CORE, CX - BASE*.36, CY - BASE*.2, BASE*.72, BASE*.4);
  const sq = Math.sqrt(stride);
  for(let b = 0; b < 5; b++){
    ctx.fillStyle = BK[b]; ctx.globalAlpha = BA[b]*ga;
    for(let i = BS[b]; i < BS[b + 1]; i += stride){
      const r = GR[i]*grow, th = GT[i] + GO[i]*tt;
      const x = r*Math.cos(th), z = r*Math.sin(th), y = GY[i];
      const y2 = y*cp + z*sp, k = KC/(z*cp - y*sp + CAM), s = GS[i]*SS*sq*k/BASE;
      ctx.fillRect(CX + x*k, CY - y2*k, s, s);
    }
  }
  // brasas que suben hacia el corazón
  ctx.fillStyle = 'rgb(255,222,110)';
  for(const e of embers){
    e.u += dt*e.sp*(reduce ? .2 : 1); if(e.u > 1){ e.u = 0; e.ox = (Math.random()-.5)*.14; }
    const y = e.u*(HEART_Y - .1), x = e.ox*(1 - e.u*.6) + Math.sin(tt*2 + e.ph)*.02;
    const k = KC/(-y*sp + CAM), s = (1.5 + e.u)*SS;
    ctx.globalAlpha = Math.sin(Math.PI*e.u)*.9*ga; ctx.fillRect(CX + x*k, CY - y*cp*k, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';

  // objetos 3D (ramos orbitan la galaxia; palabras y frase orbitan el corazón)
  for(const it of items){
    const a = it.a0 + tt*it.w, lz = ORB*it.R*Math.sin(a);
    const x = ORB*it.R*Math.cos(a), y = it.oy + it.h + lz*it.st + (it.type === 'b' ? Math.sin(tt*.8 + it.ph)*.015 : 0), z = lz*it.ct;
    const y2 = y*cp + z*sp, d = z*cp - y*sp + CAM, k = KC/d;
    it.sx = CX + x*k; it.sy = CY - y2*k; it.k = k; it.d = d;
  }
  items.sort((p, q) => q.d - p.d);
  for(const it of items) if(it.d > HD) drawItem(it, tt, intro);
  drawHeart(tt, intro);
  for(const it of items) if(it.d <= HD) drawItem(it, tt, intro);

  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

/* ---------- música, entrada y controles ---------- */
const gate = $('gate'), enter = $('enter'), hint = $('hint'), mute = $('mute');
const gf = $('gate-flower'); sunflower(gf.getContext('2d'), 80, 80, 74);

const audio = new Audio(window.MUSIC_SRC || '');
audio.loop = true; audio.preload = 'auto'; audio.volume = .85;
let playing = false;

enter.addEventListener('click', async () => {
  enter.disabled = true;
  audio.play().then(() => { playing = true; }).catch(() => {});   // el clic permite reproducir la canción
  gate.classList.add('out'); mute.classList.add('show');
  try{
    if(document.fonts && document.fonts.load){
      await Promise.race([Promise.all([document.fonts.load('700 40px Quicksand'), document.fonts.load('600 40px "Dancing Script"')]), new Promise(r => setTimeout(r, 1200))]);
    }
  }catch(e){}
  build(); resize();
  hint.hidden = false; hint.classList.add('show');
  last = performance.now(); requestAnimationFrame(frame);
  setTimeout(() => gate.remove(), 900);
}, {once:true});

mute.addEventListener('click', () => {
  audio.muted = !audio.muted;
  mute.setAttribute('aria-pressed', audio.muted);
  mute.setAttribute('aria-label', audio.muted ? 'Activar música' : 'Silenciar música');
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden) audio.pause(); else if(playing) audio.play().catch(() => {});
});

/* ---------- carta ---------- */
const ov = $('overlay'), closeBtn = $('close'), C = CONFIG.card;
$('c-title').textContent = C.title; $('c-intro').textContent = C.intro;
$('c-msg').textContent = C.message; $('c-to').textContent = C.to; hint.textContent = CONFIG.hint;
const img = $('c-img'); img.alt = C.photoAlt; img.onerror = () => { $('c-photo').hidden = true; };
img.src = C.photo || window.PHOTO_SRC || '';

let lastFocus = null;
function openCard(){ lastFocus = document.activeElement; ov.classList.add('open'); hint.style.visibility = 'hidden'; closeBtn.focus(); }
function closeCard(){ ov.classList.remove('open'); hint.style.visibility = ''; if(lastFocus && lastFocus.focus) lastFocus.focus(); }
closeBtn.addEventListener('click', closeCard);
ov.addEventListener('click', e => { if(e.target === ov) closeCard(); });
addEventListener('keydown', e => { if(e.key === 'Escape' && ov.classList.contains('open')) closeCard(); });
hint.addEventListener('click', openCard);
const hitAt = e => hits.some(h => Math.hypot(e.clientX - h.x, e.clientY - h.y) < h.r*1.1);
cv.addEventListener('click', e => { if(built && hitAt(e)) openCard(); });
cv.addEventListener('pointermove', e => { cv.style.cursor = built && hitAt(e) ? 'pointer' : 'default'; });
}
document.addEventListener('DOMContentLoaded', main);
</script>
